name: Build and publish wheels

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Wheels on ${{ matrix.os }} (${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # x86_64
            archs: x86_64
          - os: ubuntu-24.04-arm     # native arm64, no QEMU emulation
            archs: aarch64
          - os: windows-latest       # AMD64
            archs: AMD64
          - os: macos-15-intel       # x86_64
            archs: x86_64
          - os: macos-15             # arm64
            archs: arm64

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    - name: Build wheels
      uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
      env:
        CIBW_ARCHS: ${{ matrix.archs }}
        CIBW_BUILD: cp312-* cp313-* cp314-* cp315-*
        CIBW_SKIP: "*_i686 *musllinux* *_ppc64le *_s390x *win32*"
        CIBW_TEST_REQUIRES: pytest numpy
        CIBW_TEST_COMMAND: pytest {project}/tests/test.py

    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.archs }}
        path: wheelhouse/*.whl
        if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Download wheels
      uses: actions/download-artifact@v8
      with:
        pattern: wheels-*
        path: wheelhouse
        merge-multiple: true

    - uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    - name: Install Twine
      run: python -m pip install twine

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload --skip-existing wheelhouse/*.whl
