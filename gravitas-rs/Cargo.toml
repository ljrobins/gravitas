[package]
name = "gravitas"
version = "0.1.0"
edition = "2021"

[lib]
name = "gravitas"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "auto-initialize"] }
rayon = "1.10"
numpy = "0.22"
thread_local = "1.1"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[profile.release]
opt-level = 3
lto = true
