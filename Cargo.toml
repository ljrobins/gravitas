[package]
name = "gravitas"
version = "0.2.13"
edition = "2021"
include = [
    "src/*.rs",
    "src/*.txt",
    "Cargo.toml",
    "Cargo.lock",
]

[lib]
name = "gravitas"
crate-type = ["cdylib"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.maturin]
includes = ["src/*.txt"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
numpy = "0.22"
thread_local = "1.1"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[profile.release]
opt-level = 3
lto = true
